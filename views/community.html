<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Forum</title>
    <link rel="stylesheet" href="../css/stylesheets/community.css">
</head>

<body>

    <header class="header">
        <a href="../index.html"><img src="../assets/img/logos/textLogo/textLogoTangBlue.png" alt="Isologo de Dungeons and Designers con un color cambiante de Azul Marino a Blanco Azulado."></a>
        <nav>
            <ul>
                <li>Foro de la Comunidad</li>
                <li><a class="header__profile" href="./profile.html" aria-label="Ir a la Página de Inicio de Sesión o Creación de la Cuenta"><img src="../assets/icons/dragonColumbiaBlue.svg"></a></li>
            </ul>
        </nav>
    </header>

    <div class="container">

        <main>
            <section class="new-post">
                <h2>Nuevo mensaje</h2>
                <form id="post-form">
                    <div class="form-group">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" maxlength="50" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Mensaje:</label>
                        <textarea id="message" maxlength="500" required></textarea>
                    </div>
                    <button type="submit" id="submit-btn">Publicar</button>
                </form>
            </section>

            <section class="posts">
                <h2>Mensajes</h2>
                <div class="loading" id="loading">Cargando mensajes...</div>
                <div id="error-message" class="error-message"></div>
                <div id="posts-container"></div>
            </section>
        </main>

    </div>
        <footer class="footer">
            <p>Diseño y Desarrollo: <a href="https://github.com/ArtDaSak" target="_blank" aria-label="Ir al Perfil de GitHub de la Persona que desarrolló el proyecto.">ArtDaSak</a> | Recursos e inspiración: © 1993-2025 Wizards of the Coast LLC, una filial de Hasbro, Inc. | Todos los derechos reservados.</p>
        </footer>
    
    <script src="../js/scripts/community.js"></script>
</body>

</html>
