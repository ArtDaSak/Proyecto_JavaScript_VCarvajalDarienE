<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>D&D</title>
    <link rel="icon" href="../assets/img/favicon.png" type="image/png"/>

    <link rel="stylesheet" href="../css/stylesheets/characterBuilder.css"/>
    <script type="module" src="../js/scripts/characterBuilder.js"></script>
</head>

<body>
    <header class="header">
        <a href="../index.html"><img src="../assets/img/logos/textLogo/textLogoTangBlue.png" alt="Isologo de Dungeons and Designers con un color cambiante de Azul Marino a Blanco Azulado."></a>
        <nav>
            <ul>
                <li>Creación de Personajes</li>
                <li><a class="header__profile" href="./profile.html" aria-label="Ir a la Página de Inicio de Sesión o Creación de la Cuenta"><img src="../assets/icons/dragonColumbiaBlue.svg"></a></li>
            </ul>
        </nav>
    </header>

    <main></main>
        <form id="characterForm">
            <label for="characterName">Nombre del Personaje:</label>
            <input type="text" id="characterName" name="characterName" required/>

            <label for="characterClass">Clase del Personaje:</label>
            <select id="characterClass" name="characterClass" required>
                <option value="warrior">Guerrero</option>
                <option value="mage">Mago</option>
                <option value="rogue">Pícaro</option>
            </select>

            <button type="submit">Crear Personaje</button>
        </form>
    </main>

    <footer class="footer">
        <p>Diseño y Desarrollo: <a href="https://github.com/ArtDaSak" target="_blank" aria-label="Ir al Perfil de GitHub de la Persona que desarrolló el proyecto.">ArtDaSak</a> | Recursos e inspiración: © 1993-2025 Wizards of the Coast LLC, una filial de Hasbro, Inc. | Todos los derechos reservados.</p>
    </footer>

    <script type="module">
        import { createCharacter } from '../js/scripts/characterBuilder.js';
        import { fetchApiData } from '../js/api.js';

        const form = document.getElementById('characterForm');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const characterName = document.getElementById('characterName').value;
            const characterClass = document.getElementById('characterClass').value;

            // Llamar a la función para crear el personaje
            const character = createCharacter(characterName, characterClass);

            // Opcional: Llamar a la API para guardar el personaje
            await fetchApiData(character);

            alert('Personaje creado con éxito');
        });
    </script>
</body>

</html>
